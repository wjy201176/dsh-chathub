      'historyView.turns': ' · 来自历史的 {n} 轮对话',
      'historyView.gaveNoAnswer': '该模型对这次对话没有回答（额度用尽、已退出登录，或仍在生成）。',
      'historyView.noStored': '没有为该模型保存回答。',
    },
  }

  let language = 'en'
  const LOCALES = { en: 'en-US', zh: 'zh-CN' }

  /** The locale used for the dates in the history and summary timelines. */
  const locale = () => LOCALES[language] ?? 'en-US'

  /**
   * Look up one interface string.
   * @param {string} key - a key in {@link I18N}.
   * @param {object} [vars] - `{name}` placeholders to substitute.
   * @returns {string} the string in the current language, or English when the translation is missing.
   */
  function t(key, vars) {
    const table = I18N[language] ?? I18N.en
    const template = table[key] ?? I18N.en[key] ?? key
    if (vars === undefined) return template
    return template.replace(/\{(\w+)\}/g, (match, name) => (vars[name] === undefined ? match : String(vars[name])))
  }

  // The chatHub window is its own browser profile, so it has no DSH session
  // cookie. The Host put a random per-launch token in this page's URL; every
  // API call echoes it back so the Host can authenticate the window.
  const TOKEN = new URLSearchParams(location.search).get('t') ?? ''
  const withToken = (path) => (TOKEN === '' ? `api/${path}` : `api/${path}${path.includes('?') ? '&' : '?'}t=${encodeURIComponent(TOKEN)}`)
  const authHeaders = TOKEN === '' ? {} : { 'x-chathub-token': TOKEN }
  const api = (path, init) => fetch(withToken(path), { cache: 'no-store', ...init, headers: { ...authHeaders, ...(init?.headers ?? {}) } })

  const state = {
    panes: new Map(PANES.map((p) => [p.id, { ...p, status: null, etag: '', url: '', focused: false, frameW: FRAME_W, frameH: FRAME_H }])),
    activePane: PANES[0].id,
    /** The column that covers the window, or null for the five-column view. */
    expandedPane: null,
    attachments: [],
    sending: false,
    summarizing: false,
    startingSession: false,
    /** Stored chats, newest first, as the Host reports them. */
    history: [],
    activeHistoryId: null,
    viewingHistory: false,
    /** Saved summaries, newest first. */
    summaries: [],
    activeSummaryId: null,
    /** While in the future, the status line shows an action message, not the poll. */
    statusHoldUntil: 0,
    voice: null,
    /** Ctrl+F state: matches per column, the global position, and the debounce. */
    find: { open: false, query: '', total: 0, counts: {}, order: [], position: -1, activePane: null, active: null, searching: false, pendingStep: 0, sequence: 0, timer: null },
  }

  // ---------- rail ----------
  const paneList = document.getElementById('pane-list')
  const statusEl = document.getElementById('status')

  function status(text, tone) {
    statusEl.textContent = text
    statusEl.dataset.tone = tone ?? ''
    // A message from an ACTION outlives the next few status polls: the poll runs
    // every 4s and would otherwise erase "chat deleted" or "opened …" before the
    // reader can see it.
    state.statusHoldUntil = text === '' ? 0 : Date.now() + 6000
  }

  /** The connection line, only when no action message is still on screen. */
  function statusAmbient(text, tone) {
    if (Date.now() < (state.statusHoldUntil ?? 0)) return
    statusEl.textContent = text
    statusEl.dataset.tone = tone ?? ''
  }

  function renderRail() {
    paneList.textContent = ''
    for (const pane of state.panes.values()) {
      const chip = document.createElement('button')
      chip.className = 'pane-chip'
      chip.dataset.active = String(state.activePane === pane.id)
      chip.title = pane.status?.href ?? pane.title

      const dot = document.createElement('span')
      dot.className = 'dot'
      dot.dataset.state = paneState(pane)

      const meta = document.createElement('span')
      meta.className = 'chip-meta'
      const name = document.createElement('b')
      name.textContent = pane.title
      const sub = document.createElement('span')
      sub.textContent = paneSubtitle(pane)
      meta.append(name, sub)

      chip.append(dot, meta)
      chip.addEventListener('click', () => focusPane(pane.id))
      paneList.append(chip)
    }
  }

  function paneState(pane) {
    if (pane.status?.loginRequired === true) return 'login'
    if (pane.status?.ready === true) return 'ready'
    if (pane.status === null) return 'idle'
    return 'error'
  }

  function paneSubtitle(pane) {
    if (pane.status?.loginRequired === true) return t('pane.signIn')
    if (pane.status?.ready === true) return t('pane.ready')
    if (pane.status === null) return t('pane.loading')
    return t('pane.waiting')
  }

  // ---------- history ----------
  const historyList = document.getElementById('history-list')
  const historyToggle = document.getElementById('history-toggle')

  /** "Today" / "Yesterday" / "12 Oct 2026" — the timeline's group labels. */
  function dayLabel(ms) {
    const date = new Date(ms)
    const midnight = new Date()
    midnight.setHours(0, 0, 0, 0)
    const today = midnight.getTime()
    const day = new Date(date)
    day.setHours(0, 0, 0, 0)
    const diffDays = Math.round((today - day.getTime()) / 86400000)
    if (diffDays === 0) return t('history.today')
    if (diffDays === 1) return t('history.yesterday')
    if (diffDays < 7) return t('history.daysAgo', { n: diffDays })
    return date.toLocaleDateString(locale(), { day: 'numeric', month: 'short', year: 'numeric' })
  }

  /** "14:32" — the time shown under each entry. */
  function timeLabel(ms) {
    return new Date(ms).toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' })
  }

  function renderHistory() {
    historyList.textContent = ''
    const entries = state.history
    if (entries.length === 0) {
      const empty = document.createElement('div')
      empty.className = 'history-empty'
      empty.textContent = t('history.empty')
      historyList.append(empty)
      return
    }
    let currentGroup = null
    for (const entry of entries) {
      const group = dayLabel(entry.updatedAt ?? entry.createdAt ?? Date.now())
      if (group !== currentGroup) {
        currentGroup = group
        const header = document.createElement('div')
        header.className = 'history-group-label'
        header.textContent = group
        historyList.append(header)
      }

      const item = document.createElement('button')
      item.className = 'history-item'
      item.dataset.active = String(state.activeHistoryId === entry.id)
      item.title = entry.title === '' ? t('history.untitled') : entry.title

      const title = document.createElement('span')
      title.className = 'title'
      title.textContent = entry.title === '' ? t('history.untitled') : entry.title

      const meta = document.createElement('span')
      meta.className = 'meta'
      const turns = Array.isArray(entry.turns) ? entry.turns.length : 0
      meta.textContent = `${timeLabel(entry.updatedAt ?? entry.createdAt ?? Date.now())} · ${t(turns === 1 ? 'history.promptOne' : 'history.prompts', { n: turns })}`

      const del = document.createElement('button')
      del.className = 'del'
      del.textContent = '×'
      del.title = t('history.delete')
      del.addEventListener('click', (event) => {
        event.stopPropagation()
        void deleteHistory(entry.id)
      })

      // A separate control for reading the stored transcript, so the row itself
      // stays the "replay into the columns" action the user expects.
      const view = document.createElement('button')
      view.className = 'view'
      view.textContent = '⤢'
      view.title = t('history.viewTitle')
      view.addEventListener('click', (event) => {
        event.stopPropagation()
        void viewHistory(entry.id)
      })

      item.append(title, meta, view, del)
      item.title = `${entry.title === '' ? t('history.untitled') : entry.title}\n${t('history.replay')}`
      item.addEventListener('click', () => { void openHistory(entry.id) })
      historyList.append(item)
    }
  }

  async function refreshHistory() {
    try {
      const response = await api('history?limit=200')
      const payload = await response.json()
      if (payload.ok !== true) return
      state.history = Array.isArray(payload.value?.entries) ? payload.value.entries : []
      renderHistory()
    } catch {
      /* transient: the next poll retries */
    }
  }

  async function deleteHistory(id) {
    const response = await api('history/delete', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    }).catch(() => null)
    const payload = response === null ? null : await response.json().catch(() => null)
    if (payload?.ok === true) {
      if (state.activeHistoryId === id) state.activeHistoryId = null
      status(t('status.chatDeleted'), 'ok')
      await refreshHistory()
    } else {
      status(payload?.error ?? t('status.deleteChatFailed'), 'bad')
    }
  }

  // ---------- saved summaries (timeline under the columns) ----------
  const summariesList = document.getElementById('summaries-list')
  const summariesToggle = document.getElementById('timeline-toggle')
  const timelineEl = document.getElementById('timeline')
  const timelineCount = document.getElementById('timeline-count')

  /**
   * The saved-summary timeline, newest first.
   *
   * Each row is a link: the time, the prompt it summarized, and what the report
   * contains. Clicking reopens the original summary page; × removes it.
   */
  function renderSummaries() {
    summariesList.textContent = ''
    const entries = state.summaries
    timelineCount.textContent = entries.length === 0
      ? ''
      : t('summary.count', { n: entries.length })
    if (entries.length === 0) {
      const empty = document.createElement('li')
      empty.className = 'timeline-empty'
      empty.textContent = t('summary.empty')
      summariesList.append(empty)
      return
    }
    for (const entry of entries) {
      const when = entry.createdAt ?? Date.now()

      const item = document.createElement('li')
      item.className = 'timeline-item'
      item.dataset.active = String(state.activeSummaryId === entry.id)

      const dot = document.createElement('span')
      dot.className = 'timeline-dot'

      const open = document.createElement('button')
      open.className = 'timeline-open'
      open.type = 'button'
      open.title = `${entry.title || t('summary.untitled')}\n${t('summary.reopen')}`
      const stamp = document.createElement('span')
      stamp.className = 'timeline-when'
      stamp.textContent = `${dayLabel(when)} ${timeLabel(when)}`

      const label = document.createElement('span')
      label.className = 'timeline-label'
      label.textContent = entry.title === '' ? t('summary.untitled') : entry.title

      const meta = document.createElement('span')
      meta.className = 'timeline-meta'
      const bits = [
        t('summary.agreed', { n: Number(entry.consensus ?? 0) }),
        t('summary.differ', { n: Number(entry.differences ?? 0) }),
      ]
      if (entry.links > 0) bits.push(t('summary.links', { n: entry.links }))
      if (entry.degraded === true) bits.push(t('summary.degraded'))
      meta.textContent = bits.join(' · ')

      open.append(stamp, label, meta)
      open.addEventListener('click', () => { void openSummary(entry.id) })

      const tag = tagChip(entry)

      const del = document.createElement('button')
      del.className = 'timeline-del'
      del.textContent = '×'
      del.title = t('summary.delete')
      del.addEventListener('click', (event) => {
        event.stopPropagation()
        void deleteSummary(entry.id)
      })

      item.append(dot, tag, open, del)
      summariesList.append(item)
    }
  }

  /**
   * The topic chip at the left of one timeline row.
   *
   * It renders as a chip and turns into a text field on click, so renaming a
   * row is one click and Enter. Escape abandons the edit; blur keeps it, which
   * is what a reader expects when they click away mid-sentence.
   * @param {object} entry - one summary from the timeline list.
   * @returns {HTMLElement} the chip button.
   */
  function tagChip(entry) {
    const button = document.createElement('button')
    button.type = 'button'
    button.className = 'timeline-tag'
    button.textContent = entry.tag === '' ? t('summary.tag') : entry.tag
    button.dataset.edited = String(entry.tagEdited === true)
    button.dataset.empty = String(entry.tag === '')
    button.title = entry.tag === ''
      ? t('summary.tagEmptyTitle')
      : t('summary.tagTitle', { tag: entry.tag })
    button.addEventListener('click', (event) => {
      event.stopPropagation()
      startTagEdit(entry, button)
    })
    return button
  }

  /** Swap the chip for an input, then save whatever the user settles on. */
  function startTagEdit(entry, button) {
    if (button.dataset.editing === 'true') return
    button.dataset.editing = 'true'
    const input = document.createElement('input')
    input.className = 'timeline-tag-input'
    input.type = 'text'
    input.value = entry.tag ?? ''
    // Matches USER_TAG_CHARS in lib/summary.js: the store clips anything longer,
    // and a field that silently shortens what was typed is worse than a limit.
    input.maxLength = 56
    input.placeholder = t('summary.tagPlaceholder')
    button.replaceWith(input)
    input.focus()
    input.select()

    let settled = false
    const finish = (save) => {
      if (settled) return
      settled = true
      const value = input.value.trim()
      input.replaceWith(button)
      delete button.dataset.editing
      if (!save) return
      if (value === (entry.tag ?? '')) return
      void saveSummaryTag(entry.id, value)
    }
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); finish(true) }
      else if (event.key === 'Escape') { event.preventDefault(); finish(false) }
      event.stopPropagation()
    })
    input.addEventListener('blur', () => finish(true))
    input.addEventListener('click', (event) => event.stopPropagation())
  }

  /** Persist a new tag, then repaint the row from what the store kept. */
  async function saveSummaryTag(id, tag) {
    const response = await api('summaries/tag', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, tag }),
    }).catch(() => null)
    const payload = response === null ? null : await response.json().catch(() => null)
    if (payload?.ok === true) {
      const stored = state.summaries.find((entry) => entry.id === id)
      if (stored !== undefined) {
        stored.tag = payload.value.tag
        stored.tagAuto = payload.value.tagAuto
        stored.tagEdited = payload.value.tagEdited === true
      }
      renderSummaries()
      status(payload.value.tag === '' ? t('status.tagCleared') : t('status.tagged', { tag: payload.value.tag }), 'ok')
    } else {
      status(payload?.error ?? t('status.tagSaveFailed'), 'bad')
    }
  }

  async function refreshSummaries() {
    try {
      const response = await api('summaries?limit=200')
      const payload = await response.json()
      if (payload.ok !== true) return
      state.summaries = Array.isArray(payload.value?.entries) ? payload.value.entries : []
      renderSummaries()
    } catch {
      /* transient: the next poll retries */
    }
  }

  /** Reopen one saved summary in its own Edge window. */
  async function openSummary(id) {
    state.activeSummaryId = id
    renderSummaries()
    const response = await api('summaries/open', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    }).catch(() => null)
    const payload = response === null ? null : await response.json().catch(() => null)
    if (payload?.ok === true) status(t('status.summaryReopened'), 'ok')
    else status(payload?.error ?? t('status.summaryOpenFailed'), 'bad')
  }

  async function deleteSummary(id) {
    const response = await api('summaries/delete', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    }).catch(() => null)
    const payload = response === null ? null : await response.json().catch(() => null)
    if (payload?.ok === true) {
      if (state.activeSummaryId === id) state.activeSummaryId = null
      status(t('status.summaryDeleted'), 'ok')
      await refreshSummaries()
    } else {
      status(payload?.error ?? t('status.deleteSummaryFailed'), 'bad')
    }
  }

  // Collapsing hands the height straight back to the columns.
  summariesToggle.addEventListener('click', () => {
    const collapsed = timelineEl.dataset.collapsed !== 'true'
    timelineEl.dataset.collapsed = String(collapsed)
    summariesToggle.setAttribute('aria-expanded', String(!collapsed))
    summariesToggle.title = collapsed ? t('summary.expand') : t('summary.collapse')
  })

  /**
   * Reopen a stored chat in the columns.
   *
   * Each column is navigated to that provider's own conversation URL, so the
   * model's real view is restored — the same outlook as a live session. Columns
   * whose URL was not recorded fall back to the captured text. No prompt is
   * re-sent, so this costs no quota.
   */
  async function openHistory(id) {
    const entry = state.history.find((candidate) => candidate.id === id)
    const turns = Array.isArray(entry?.turns) ? entry.turns.length : 0
    if (turns === 0) {
      status(t('status.noRecordedPrompts'), 'bad')
      return
    }
    state.activeHistoryId = id
    renderHistory()
    status(t('status.restoringChat'))
    try {
      const response = await api('history/open', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id }),
      })
      const payload = await response.json()
      if (payload.ok !== true) {
        status(payload.error ?? t('status.loadChatFailed'), 'bad')
        return
      }
      showHistoryInColumns(payload.value)
      const native = (payload.value.native ?? []).length
      const fallback = (payload.value.fallback ?? []).length
      const missing = Object.values(payload.value.missing ?? {}).filter((list) => list.length > 0).length
      const parts = [t('status.restored', { title: payload.value.title })]
      if (native > 0) parts.push(t('status.reopenedNatively', { n: native }))
      if (fallback > 0) parts.push(t('status.fromCaptured', { n: fallback }))
      if (missing > 0) parts.push(t('status.hadNoAnswer', { n: missing }))
      status(parts.join(' · '), missing === 0 ? 'ok' : '')
    } catch (error) {
      status(String(error.message ?? error), 'bad')
    }
  }

  /**
   * Show a loaded chat in the columns.
   *
   * A column whose provider URL could be restored is left in its LIVE mode: the
   * Host navigated that tab to the real conversation, so its screenshot already
   * shows the model's own view — formatting, code blocks and all. Only columns
   * without a stored URL fall back to rendering the captured text, which is what
   * every column did before the URLs were kept.
   */
  function showHistoryInColumns(value) {
    const native = new Set(value.native ?? [])
    for (const pane of state.panes.values()) {
      const refs = columnRefs.get(pane.id)
      if (!refs) continue
      refs.hvHead.textContent = ''
      refs.hvBody.textContent = ''

      if (native.has(pane.id)) {
        // The provider's own conversation is on screen; nothing to overlay.
        refs.body.dataset.mode = 'live'
        continue
      }

      const answers = value.transcripts?.[pane.id] ?? []
      const missing = value.missing?.[pane.id] ?? []

      const label = document.createElement('b')
      label.textContent = pane.title
      const note = document.createElement('span')
      note.textContent = answers.length === 0
        ? t('historyView.noAnswer')
        : t(answers.length === 1 ? 'historyView.turn' : 'historyView.turns', { n: answers.length })
      refs.hvHead.append(label, note)

      for (const answer of answers) {
        const block = document.createElement('div')
        block.className = 'hv-turn'
        const prompt = document.createElement('div')
        prompt.className = 'hv-prompt'
        prompt.textContent = answer.prompt
        prompt.title = answer.prompt
        const text = document.createElement('div')
        text.className = 'hv-answer'
        text.textContent = answer.text
        block.append(prompt, text)
        refs.hvBody.append(block)
      }
      if (answers.length === 0) {
        const none = document.createElement('div')
        none.className = 'hv-none'
        none.textContent = missing.length > 0
          ? t('historyView.gaveNoAnswer')
          : t('historyView.noStored')
        refs.hvBody.append(none)
      }

      refs.body.dataset.mode = 'history'
    }
    state.viewingHistory = true
    const banner = document.getElementById('history-banner')
    if (banner) banner.hidden = false
    renderRail()
  }

  /** Return every column to its live view. */
  function exitHistoryView() {
    if (!state.viewingHistory) return
    state.viewingHistory = false
    state.activeHistoryId = null
    for (const refs of columnRefs.values()) refs.body.dataset.mode = 'live'
    const banner = document.getElementById('history-banner')
    if (banner) banner.hidden = true
    renderHistory()
    renderRail()
    // The Host tracks which source Summarize should read; leaving history must
    // be reported, or a later summary would keep reading the stored chat.
    void api('history/exit', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}',
    }).catch(() => {})
    status(t('status.backLive'))
  }

  /** Open a read-only transcript of a stored chat in its own window. */
  async function viewHistory(id) {
    const opened = await api('history/view', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    }).catch(() => null)
    const result = opened === null ? null : await opened.json().catch(() => null)
    if (result?.ok === true) status(t('status.transcriptOpened'), 'ok')
    else status(result?.error ?? t('status.openChatFailed'), 'bad')
  }

  historyToggle.addEventListener('click', () => {
    const open = historyToggle.dataset.open !== 'false'
    historyToggle.dataset.open = String(!open)
    historyToggle.setAttribute('aria-expanded', String(!open))
    historyList.hidden = open
  })

  // ---------- new session ----------
  const newSessionButton = document.getElementById('btn-new-session')
  newSessionButton.addEventListener('click', async () => {
    if (state.startingSession) return
    state.startingSession = true
    newSessionButton.disabled = true
    exitHistoryView()
    status(t('status.newSession'))
    try {
      const response = await api('session/new', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: '{}',
      })
      const payload = await response.json()
      if (payload.ok !== true) {
        status(payload.error ?? t('status.newSessionFailed'), 'bad')
        return
      }
      const failed = Object.entries(payload.value.results).filter(([, value]) => value.ok !== true)
      status(
        failed.length === 0
          ? t('status.allCleared')
          : t('status.clearedPartly', { done: state.panes.size - failed.length, total: state.panes.size, failed: failed.map(([id]) => id).join(', ') }),
        failed.length === 0 ? 'ok' : 'bad',
      )
      state.activeHistoryId = null
      await refreshHistory()
      void refreshState()
    } catch (error) {
      status(String(error.message ?? error), 'bad')
    } finally {
      state.startingSession = false
      newSessionButton.disabled = false
    }
  })

  // Leaving history mode restores the live screenshots immediately.
  const exitHistoryButton = document.getElementById('btn-exit-history')
  exitHistoryButton.addEventListener('click', () => {
    exitHistoryView()
    void pumpFrames()
  })

  // ---------- grid ----------
  const grid = document.getElementById('grid')
  const columnRefs = new Map()

  function renderGrid() {
    grid.textContent = ''
    for (const pane of state.panes.values()) {
      const column = document.createElement('section')
      column.className = 'column'

      const head = document.createElement('div')
      head.className = 'column-head'
      const dot = document.createElement('span')
      dot.className = 'dot'
      const title = document.createElement('b')
      title.textContent = pane.title
      const spacer = document.createElement('span')
      spacer.className = 'spacer'
      const reload = document.createElement('button')
      reload.className = 'reload'
      reload.textContent = t('column.reload')
      reload.title = t('column.reload.title', { model: pane.title })
      reload.addEventListener('click', () => reloadPane(pane.id))
      // Full screen: one column at the width of the window. The Host widens that
      // provider tab's viewport to match, so the page reflows instead of being a
      // narrow screenshot stretched over the screen.
      const fullScreen = document.createElement('button')
      fullScreen.className = 'full-screen'
      fullScreen.textContent = t('column.full')
      fullScreen.title = t('column.full.title', { model: pane.title })
      fullScreen.addEventListener('click', (event) => {
        event.stopPropagation()
        void toggleFullScreen(pane.id)
      })
      head.append(dot, title, spacer, reload, fullScreen)

      const body = document.createElement('div')
      body.className = 'column-body'
      body.tabIndex = 0
      body.dataset.focus = 'false'
      body.dataset.mode = 'live'
      const img = document.createElement('img')
      img.alt = t('column.liveView', { model: pane.title })
      img.draggable = false
      const placeholder = document.createElement('div')
      placeholder.className = 'placeholder'
      const placeholderTitle = document.createElement('div')
      placeholderTitle.textContent = pane.title
      const loadingText = document.createElement('div')
      loadingText.style.fontSize = '11px'
      loadingText.textContent = t('column.loading')
      placeholder.append(placeholderTitle, loadingText)
      const signIn = document.createElement('button')
      signIn.className = 'signin-overlay'
      signIn.type = 'button'
      signIn.hidden = true
      signIn.textContent = t('column.signIn', { model: pane.title })
      signIn.addEventListener('click', () => startLogin(pane))
      const loginHint = document.createElement('div')
      loginHint.className = 'login-hint'
      loginHint.hidden = true
      const hint = document.createElement('div')
      hint.className = 'focus-hint'
      hint.textContent = t('column.click')
      // Stored chat rendered in place of the live screenshot.
      const historyView = document.createElement('div')
      historyView.className = 'history-view'
      const hvHead = document.createElement('div')
      hvHead.className = 'hv-head'
      const hvBody = document.createElement('div')
      hvBody.className = 'hv-body'
      historyView.append(hvHead, hvBody)
      body.append(img, placeholder, signIn, loginHint, hint, historyView)

      column.append(head, body)
      grid.append(column)
      columnRefs.set(pane.id, { column, head, body, img, placeholder, dot, signIn, loginHint, historyView, hvHead, hvBody, titleEl: title, fullScreen, reload, hint, loadingText })

      wirePointer(pane, body, img)
      wireKeyboard(pane, body)
    }
  }

  /**
   * One column covering the whole window.
   *
   * Clicking the button again restores the five-column view. The provider tab
   * is resized with the column, so the screenshot is a wide page rendered at
   * the window size, not a narrow image stretched to fit.
   */
  async function toggleFullScreen(paneId) {
    if (state.expandedPane === paneId) {
      collapseFullScreen()
      return
    }
    const pane = state.panes.get(paneId)
    if (pane === undefined) return
    state.expandedPane = paneId
    syncExpanded()
    if (typeof document.documentElement.requestFullscreen === 'function') {
      // Best effort: the Edge app window may refuse, and the column still covers
      // the window. Esc leaves the browser's full screen, which collapses this.
      try {
        document.documentElement.requestFullscreen().catch(() => {})
      } catch {
        /* a refused or unsupported full screen does not block the layout */
      }
    }
    focusPane(paneId)
    const size = expandedBodySize(paneId)
    if (size !== null) void sendViewport(pane, size.width, size.height)
    void pumpFrames()
  }

  function collapseFullScreen(options = {}) {
    const paneId = state.expandedPane
    if (paneId === null) return
    state.expandedPane = null
    syncExpanded()
    if (options.exitFullscreen !== false && document.fullscreenElement !== null) {
      try {
        document.exitFullscreen?.().catch(() => {})
      } catch {
        /* already out of full screen */
      }
    }
    const pane = state.panes.get(paneId)
    if (pane !== undefined) void sendViewport(pane, FRAME_W, FRAME_H)
    void pumpFrames()
  }

  /** Push the expanded state into the layout and the per-column button labels. */
  function syncExpanded() {
    const expanded = state.expandedPane
    document.body.dataset.expanded = String(expanded !== null)
    grid.dataset.expanded = String(expanded !== null)
    for (const [id, refs] of columnRefs) {
      refs.column.dataset.expanded = String(expanded === id)
      if (refs.fullScreen !== undefined) {
        refs.fullScreen.textContent = expanded === id ? t('column.restore') : t('column.full')
        refs.fullScreen.title = expanded === id ? t('column.restore.title') : t('column.full.title', { model: refs.titleEl.textContent })
      }
    }
  }

  /** The room the expanded column's screenshot has to fill, in CSS pixels. */
  function expandedBodySize(paneId) {
    const refs = columnRefs.get(paneId)
    if (refs === undefined) return null
    const rect = refs.body.getBoundingClientRect()
    const width = Math.round(rect.width)
    const height = Math.round(rect.height)
    return width > 0 && height > 0 ? { width, height } : null
  }

  async function sendViewport(pane, width, height) {
    await api('viewport', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pane: pane.id, width, height }),
    }).catch(() => {})
  }

  // ---------- find in the models' answers ----------
  // The columns are screenshots of background tabs, so the browser's own find
  // bar cannot see the models' words. Ctrl+F opens this bar instead; the Host
  // runs the search inside every provider tab and the matches show up as
  // highlights in the screenshots.
  const findBar = document.getElementById('find-bar')
  const findInput = document.getElementById('find-input')
  const findCount = document.getElementById('find-count')
  const findJson = { 'content-type': 'application/json' }

  function openFind() {
    state.find.open = true
    findBar.dataset.open = 'true'
    findInput.focus()
    findInput.select()
    if (state.find.query !== '') void runFind(state.find.query)
  }

  /** Mark the column whose match is active, so a jump is visible even when the
   *  provider's own scroll barely moves. */
  function markFindTarget(paneId) {
    for (const [id, refs] of columnRefs) {
      refs.column.dataset.find = String(paneId === id)
    }
  }

  function resetFindResults() {
    const find = state.find
    find.total = 0
    find.counts = {}
    find.order = []
    find.position = -1
    find.activePane = null
    find.active = null
    markFindTarget(null)
  }

  function closeFind() {
    if (!state.find.open) return
    state.find.open = false
    state.find.searching = false
    state.find.sequence += 1
    findBar.dataset.open = 'false'
    resetFindResults()
    state.find.pendingStep = 0
    findCount.textContent = ''
    findInput.blur()
    void api('find', { method: 'POST', headers: findJson, body: JSON.stringify({ mode: 'clear' }) }).catch(() => {})
  }

  function showFindCount() {
    const find = state.find
    // A search across five tabs takes a moment; say so instead of showing the
    // previous result set as if it were the current one.
    if (find.searching === true && find.total === 0) {
      findCount.textContent = t('find.searching')
      return
    }
    if (find.total === 0) {
      findCount.textContent = find.query.trim() === '' ? '' : t('find.noMatches')
      return
    }
    if (find.position < 0) {
      findCount.textContent = t('find.matches', { n: find.total })
      return
    }
    const pane = state.panes.get(find.activePane)
    const local = find.active === null ? 0 : find.active.index + 1
    const localCount = Number(find.counts[find.activePane] ?? 0)
    findCount.textContent = t('find.position', { column: pane?.title ?? find.activePane, local, localCount, global: find.position + 1, total: find.total })
  }

  async function runFind(rawQuery) {
    const find = state.find
    const query = String(rawQuery ?? '')
    find.query = query
    find.timer = null
    find.sequence += 1
    const sequence = find.sequence
    if (query.trim() === '') {
      find.searching = false
      find.pendingStep = 0
      resetFindResults()
      showFindCount()
      await api('find', { method: 'POST', headers: findJson, body: JSON.stringify({ mode: 'clear' }) }).catch(() => {})
      return
    }
    find.searching = true
    resetFindResults()
    showFindCount()
    const payload = await api('find', {
      method: 'POST',
      headers: findJson,
      body: JSON.stringify({ mode: 'search', query }),
    }).then((response) => response.json()).catch(() => null)
    // A newer keystroke (or a closed bar) wins over this response. A closed bar
    // must not leave fresh highlights painted in the tabs.
    if (!find.open || find.sequence !== sequence) {
      if (!find.open) void api('find', { method: 'POST', headers: findJson, body: JSON.stringify({ mode: 'clear' }) }).catch(() => {})
      return
    }
    find.searching = false
    const value = payload?.ok === true ? payload.value : null
    find.total = Number(value?.total ?? 0)
    find.counts = value?.counts ?? {}
    // Start with the column the user is reading, then the rest in page order.
    const ids = PANES.map((pane) => pane.id)
    const start = ids.indexOf(state.activePane)
    const ordered = start > 0 ? [...ids.slice(start), ...ids.slice(0, start)] : ids
    find.order = ordered.filter((id) => Number(find.counts[id] ?? 0) > 0)
    find.position = -1
    find.activePane = null
    find.active = null
    markFindTarget(null)
    showFindCount()
    // Like the browser's own find, land on the first match as soon as the
    // search completes; a click made while it ran is honoured in this step.
    if (find.total > 0) {
      const direction = find.pendingStep !== 0 ? find.pendingStep : 1
      find.pendingStep = 0
      await stepFind(direction)
    }
  }

  /** Step the global match list: columns in order, each column's matches in turn. */
  async function stepFind(direction) {
    const find = state.find
    if (find.total === 0 || find.order.length === 0) {
      // The search is still running: remember the click and step once it lands.
      if (find.searching === true) find.pendingStep = direction
      return
    }
    const offset = (find.position + direction + find.total) % find.total
    let remaining = offset
    let target = null
    let index = 0
    for (const id of find.order) {
      const count = Number(find.counts[id] ?? 0)
      if (remaining < count) {
        target = id
        index = remaining
        break
      }
      remaining -= count
    }
    if (target === null) return
    if (find.activePane !== null && find.activePane !== target) {
      void api('find', { method: 'POST', headers: findJson, body: JSON.stringify({ mode: 'deactivate', pane: find.activePane }) }).catch(() => {})
    }
    find.activePane = target
    find.active = { pane: target, index }
    find.position = offset
    markFindTarget(target)
    showFindCount()
    await api('find', {
      method: 'POST',
      headers: findJson,
      body: JSON.stringify({ mode: 'activate', pane: target, index }),
    }).catch(() => {})
  }

  findInput.addEventListener('input', () => {
    const find = state.find
    clearTimeout(find.timer)
    if (findInput.value !== find.query) {
      // A search is coming (after the debounce): show that and drop the previous
      // result set, so "next" cannot step through stale matches.
      find.searching = true
      find.pendingStep = 0
      resetFindResults()
      showFindCount()
    }
    find.timer = setTimeout(() => {
      void runFind(findInput.value)
    }, 180)
  })
  findInput.addEventListener('keydown', async (event) => {
    if (event.key === 'Enter') {
      event.preventDefault()
      clearTimeout(state.find.timer)
      if (findInput.value !== state.find.query) await runFind(findInput.value)
      if (state.find.total > 0) await stepFind(event.shiftKey ? -1 : 1)
      return
    }
    if (event.key === 'Escape') closeFind()
  })
  document.getElementById('find-prev').addEventListener('click', () => { void stepFind(-1) })
  document.getElementById('find-next').addEventListener('click', () => { void stepFind(1) })
  document.getElementById('find-close').addEventListener('click', () => closeFind())

  // Ctrl+F opens the find bar (instead of the browser's own, which searches
  // this shell page only); Esc closes it before it closes a full-screen column.
  window.addEventListener('keydown', (event) => {
    const key = String(event.key ?? '').toLowerCase()
    if ((event.ctrlKey || event.metaKey) && !event.altKey && key === 'f') {
      event.preventDefault()
      event.stopPropagation()
      openFind()
      return
    }
    if (event.key !== 'Escape') return
    if (state.find.open) {
      event.preventDefault()
      event.stopPropagation()
      closeFind()
      return
    }
    if (state.expandedPane === null) return
    event.preventDefault()
    event.stopPropagation()
    collapseFullScreen()
  }, true)
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement === null && state.expandedPane !== null) {
      collapseFullScreen({ exitFullscreen: false })
    }
  })
  // A resized window while expanded needs a new viewport for that tab.
  let expandResizeTimer = null
  window.addEventListener('resize', () => {
    if (state.expandedPane === null) return
    clearTimeout(expandResizeTimer)
    expandResizeTimer = setTimeout(() => {
      const paneId = state.expandedPane
      if (paneId === null) return
      const pane = state.panes.get(paneId)
      const size = expandedBodySize(paneId)
      if (pane !== undefined && size !== null) void sendViewport(pane, size.width, size.height)
    }, 200)
  })

  function updateColumn(pane) {
    const refs = columnRefs.get(pane.id)
    if (!refs) return
    refs.dot.dataset.state = paneState(pane)
    refs.body.dataset.focus = String(state.activePane === pane.id)
    const hasFrame = typeof pane.url === 'string' && pane.url !== ''
    refs.img.style.visibility = hasFrame ? 'visible' : 'hidden'
    refs.placeholder.style.display = hasFrame ? 'none' : 'flex'
    refs.signIn.hidden = pane.status?.loginRequired !== true || pane.signingIn === true
    if (pane.signingIn === true) refs.signIn.textContent = t('column.openingSignIn')
    else refs.signIn.textContent = t('column.signIn', { model: pane.title })
    refs.loginHint.hidden = !pane.loginHint
    refs.loginHint.textContent = pane.loginHint ?? ''
  }

  /**
   * Start a sign-in inside the column itself.
   *
   * Signing in here (not in an external browser) is what makes the session
   * persist: the cookies and chat history are written to chatHub's own Edge
   * profile, which survives restarts. The Host also picks the provider's
   * preferred method — for Claude that is "Continue with email", never Apple.
   */
  async function startLogin(pane) {
    pane.signingIn = true
    updateColumn(pane)
    const payload = await api('login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pane: pane.id }),
    }).catch(() => null)
    pane.signingIn = false
    const value = payload?.ok === true ? payload.value : null
    pane.loginHint = value?.awaitingInput === true
      ? t('login.emailHint', { model: pane.title })
      : t('login.savedHint', { model: pane.title })
    updateColumn(pane)
    void refreshState()
  }

  function focusPane(id) {
    state.activePane = id
    for (const pane of state.panes.values()) updateColumn(pane)
    renderRail()
    columnRefs.get(id)?.body.focus()
  }

  // ---------- pointer forwarding ----------
  function wirePointer(pane, body, img) {
    const scale = () => {
      const rect = img.getBoundingClientRect()
      // Input coordinates are CSS pixels of the emulated viewport, which the
      // Host may have widened for a full-screen column.
      return {
        x: (pane.frameW || FRAME_W) / Math.max(1, rect.width),
        y: (pane.frameH || FRAME_H) / Math.max(1, rect.height),
        left: rect.left,
        top: rect.top,
      }
    }
    const point = (event) => {
      const s = scale()
      return {
        x: Math.round((event.clientX - s.left) * s.x),
        y: Math.round((event.clientY - s.top) * s.y),
      }
    }
    let dragging = false
    body.addEventListener('mousedown', (event) => {
      event.preventDefault()
      focusPane(pane.id)
      dragging = true
      const { x, y } = point(event)
      sendInput(pane.id, { kind: 'mouse', type: 'mousePressed', x, y, button: event.button === 2 ? 'right' : 'left', clickCount: 1 })
    })
    body.addEventListener('mousemove', (event) => {
      if (!dragging) return
      const { x, y } = point(event)
      sendInput(pane.id, { kind: 'mouse', type: 'mouseMoved', x, y })
    })
    window.addEventListener('mouseup', (event) => {
      if (!dragging) return
      dragging = false
      const { x, y } = point(event)
      sendInput(pane.id, { kind: 'mouse', type: 'mouseReleased', x, y, button: event.button === 2 ? 'right' : 'left', clickCount: 1 })
    })
    body.addEventListener('wheel', (event) => {
      event.preventDefault()
      const { x, y } = point(event)
      sendInput(pane.id, { kind: 'mouse', type: 'mouseWheel', x, y, deltaX: event.deltaX, deltaY: event.deltaY })
    }, { passive: false })
    body.addEventListener('contextmenu', (event) => event.preventDefault())
  }

  // ---------- keyboard forwarding ----------
  const SPECIAL = new Set(['Backspace', 'Enter', 'Tab', 'Escape', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Delete'])

  function wireKeyboard(pane, body) {
    body.addEventListener('keydown', (event) => {
      if (event.key === 'F5') return
      if (event.ctrlKey || event.metaKey || event.altKey) {
        sendInput(pane.id, {
          kind: 'key',
          type: 'rawKeyDown',
          key: event.key,
          code: event.code,
          windowsVirtualKeyCode: event.keyCode,
          modifiers: modifiersOf(event),
        })
        return
      }
      if (SPECIAL.has(event.key)) {
        event.preventDefault()
        sendInput(pane.id, {
          kind: 'key',
          type: 'keyDown',
          key: event.key,
          code: event.code,
          windowsVirtualKeyCode: event.keyCode,
        })
        sendInput(pane.id, {
          kind: 'key',
          type: 'keyUp',
          key: event.key,
          code: event.code,
          windowsVirtualKeyCode: event.keyCode,
        })
        return
      }
      if (event.key.length === 1) {
        event.preventDefault()
        sendInput(pane.id, { kind: 'text', text: event.key })
      }
    })
  }

  function modifiersOf(event) {
    return (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0) | (event.metaKey ? 4 : 0) | (event.shiftKey ? 8 : 0)
  }

  function sendInput(pane, payload) {
    api('input', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pane, event: payload }),
    }).catch(() => {})
  }

  // ---------- live frames ----------
  const FRAME_INTERVAL = 320
  const FRAME_TIMEOUT_MS = 4000
  let frameTimer = null
  let frameBusy = false
  let frameBusySince = 0

  /** fetch() with a deadline: a stalled request must never wedge the loop. */
  function fetchWithTimeout(url, ms) {
    const controller = new AbortController()
    const timer = setTimeout(() => controller.abort(), ms)
    return fetch(url, { cache: 'no-store', signal: controller.signal }).finally(() => clearTimeout(timer))
  }

  /** Adopt the emulated viewport size the Host reports with each frame. */
  function applyFrameSize(pane, response) {
    const width = Number(response.headers.get('x-frame-width') ?? '')
    const height = Number(response.headers.get('x-frame-height') ?? '')
    if (Number.isFinite(width) && width > 0) pane.frameW = width
    if (Number.isFinite(height) && height > 0) pane.frameH = height
  }

  async function pumpFrames() {
    // Self-heal: a previous tick that never settled must not stop the stream.
    if (frameBusy && Date.now() - frameBusySince < FRAME_TIMEOUT_MS) return
    frameBusy = true
    frameBusySince = Date.now()
    try {
      for (const pane of state.panes.values()) {
        // Only the expanded column is on screen; the other four need no capture.
        if (state.expandedPane !== null && pane.id !== state.expandedPane) continue
        // A column rendering captured text has no screenshot to update; a column
        // showing its restored native conversation must keep streaming.
        const refs = columnRefs.get(pane.id)
        if (refs && refs.body.dataset.mode === 'history') continue
        let response
        try {
          response = await fetchWithTimeout(withToken(`frame?pane=${encodeURIComponent(pane.id)}&etag=${encodeURIComponent(pane.etag)}`), FRAME_TIMEOUT_MS)
        } catch {
          continue
        }
        if (response.status === 304) {
          applyFrameSize(pane, response)
          continue
        }
        if (!response.ok) continue
        applyFrameSize(pane, response)
        const etag = response.headers.get('etag') ?? ''
        const blob = await response.blob()
        if (blob.size === 0) continue
        const nextUrl = URL.createObjectURL(blob)
        const target = columnRefs.get(pane.id)
        if (target) {
          target.img.src = nextUrl
          target.img.style.visibility = 'visible'
          target.placeholder.style.display = 'none'
        }
        // Release the previous object URL only after the new one is attached, so
        // the <img> never points at a revoked blob.
        const previous = pane.url
        pane.url = nextUrl
        pane.etag = etag
        if (typeof previous === 'string' && previous !== '') URL.revokeObjectURL(previous)
      }
    } catch {
      /* transient: the next tick retries */
    } finally {
      frameBusy = false
    }
  }

  function startFrames() {
    if (frameTimer !== null) return
    frameTimer = setInterval(() => { void pumpFrames() }, FRAME_INTERVAL)
    void pumpFrames()
  }

  // ---------- status polling ----------
  async function refreshState() {
    try {
      const response = await api('state')
      const payload = await response.json()
      if (payload.ok !== true) {
        status(payload.error ?? t('status.stateUnavailable'), 'bad')
        return
      }
      const value = payload.value
      if (value.running !== true) {
        statusAmbient(value.error ?? t('status.edgeClosed'), 'bad')
      } else {
        statusAmbient(t('status.edgeOpen', { port: value.port }), 'ok')
      }
      for (const pane of state.panes.values()) {
        const remote = value.panes.find((candidate) => candidate.id === pane.id)
        if (remote === undefined) continue
        pane.remoteTargetId = remote.targetId
        pane.status = {
          ready: remote.ready === true,
          loginRequired: remote.loginRequired === true,
          href: remote.pageUrl ?? '',
          title: remote.pageTitle ?? '',
        }
        updateColumn(pane)
      }
      renderRail()
    } catch (error) {
      status(t('status.hostUnreachable', { error: String(error.message ?? error) }), 'bad')
    }
  }

  // ---------- prompt submission ----------
  const promptEl = document.getElementById('prompt')
  const sendStateEl = document.getElementById('send-state')
  const hintEl = document.getElementById('hint')
  const attachmentsEl = document.getElementById('attachments')
  const sendButton = document.getElementById('btn-send')

  function renderAttachments() {
    attachmentsEl.textContent = ''
    for (const file of state.attachments) {
      const pill = document.createElement('span')
      pill.className = 'attachment'
      pill.textContent = file.name
      attachmentsEl.append(pill)
    }
  }

  async function submitPrompt() {
    const text = promptEl.value.trim()
    if (text === '' || state.sending) return
    // Sending is a live action: leave the stored-chat view first, otherwise the
    // answers would arrive behind a panel that never shows them.
    exitHistoryView()
    state.sending = true
    sendButton.disabled = true
    sendStateEl.textContent = t('status.sending')
    sendStateEl.dataset.tone = ''
    try {
      if (state.attachments.length > 0) await uploadAttachments()
      const response = await api('prompt', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      })
      const payload = await response.json()
      if (payload.ok !== true) {
        sendStateEl.textContent = payload.error ?? t('status.sendFailed')
        sendStateEl.dataset.tone = 'bad'
        return
      }
      const failed = Object.entries(payload.value.results).filter(([, value]) => value.ok !== true)
      // Count from the actual pane list so adding a column never needs a literal.
      const total = state.panes.size
      if (failed.length === 0) {
        sendStateEl.textContent = t('status.sentAll', { n: total })
        sendStateEl.dataset.tone = 'ok'
        promptEl.value = ''
        state.attachments = []
        renderAttachments()
      } else {
        sendStateEl.textContent = t('status.sentPartly', { ok: total - failed.length, total, failed: failed.map(([id]) => id).join(', ') })
        sendStateEl.dataset.tone = 'bad'
      }
    } catch (error) {
      sendStateEl.textContent = String(error.message ?? error)
      sendStateEl.dataset.tone = 'bad'
    } finally {
      state.sending = false
      sendButton.disabled = false
    }
  }

  async function uploadAttachments() {
    for (const file of state.attachments) {
      await fetch(withToken('attach'), {
        method: 'POST',
        headers: { ...authHeaders, 'content-type': file.type || 'application/octet-stream', 'x-file-name': encodeURIComponent(file.name) },
        body: file,
      })
    }
  }

  // ---------- voice input ----------
  function startVoice() {
    const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition
    if (!Recognition) {
      hintEl.textContent = t('status.voiceUnavailable')
      hintEl.dataset.tone = 'bad'
      return
    }
    if (state.voice !== null) {
      state.voice.stop()
      state.voice = null
      return
    }
    const recognition = new Recognition()
    recognition.lang = navigator.language || 'en-US'
    recognition.continuous = false
    recognition.interimResults = true
    recognition.onresult = (event) => {
      let transcript = ''
      for (const result of event.results) transcript += result[0].transcript
      promptEl.value = transcript
      hintEl.textContent = t('status.listening')
      hintEl.dataset.tone = 'ok'
    }
    recognition.onerror = (event) => {
      hintEl.textContent = t('status.voiceFailed', { error: event.error })
      hintEl.dataset.tone = 'bad'
      state.voice = null
      document.getElementById('btn-voice').classList.remove('recording')
    }
    recognition.onend = () => {
      hintEl.textContent = ''
      hintEl.dataset.tone = ''
      state.voice = null
      document.getElementById('btn-voice').classList.remove('recording')
    }
    state.voice = recognition
    document.getElementById('btn-voice').classList.add('recording')
    recognition.start()
  }

  // ---------- wiring ----------
  document.getElementById('btn-send').addEventListener('click', () => { void submitPrompt() })
  promptEl.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      void submitPrompt()
    }
  })
  document.getElementById('btn-attach').addEventListener('click', () => document.getElementById('file').click())
  document.getElementById('file').addEventListener('change', (event) => {
    state.attachments = [...(event.target.files ?? [])]
    renderAttachments()
  })
  document.getElementById('btn-voice').addEventListener('click', () => startVoice())

  // Summarize: the Host reads every column, asks the model for one consensus +
  // differences digest, and opens the report in its own Edge window.
  const summarizeButton = document.getElementById('btn-summarize')
  summarizeButton.addEventListener('click', async () => {
    if (state.summarizing) return
    state.summarizing = true
    summarizeButton.disabled = true
    sendStateEl.textContent = t('status.summarizing')
    sendStateEl.dataset.tone = ''
    try {
      const response = await api('summarize', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: '{}',
      })
      const payload = await response.json()
      if (payload.ok !== true) {
        sendStateEl.textContent = payload.error ?? t('status.summaryFailed')
        sendStateEl.dataset.tone = 'bad'
        return
      }
      const value = payload.value
      const scope = value.source === 'history' ? t('status.scopeHistory') : t('status.scopeLive')
      const tagged = value.tag === undefined || value.tag === '' ? '' : ` · “${value.tag}”`
      sendStateEl.textContent = t('status.summarySaved', { tagged, answers: value.answers, scope, differences: value.differences })
      sendStateEl.dataset.tone = 'ok'
      // The new summary is in the timeline immediately, not on the next poll.
      state.activeSummaryId = value.id ?? null
      await refreshSummaries()
    } catch (error) {
      sendStateEl.textContent = String(error.message ?? error)
      sendStateEl.dataset.tone = 'bad'
    } finally {
      state.summarizing = false
      summarizeButton.disabled = false
    }
  })

  document.getElementById('btn-reload').addEventListener('click', async () => {
    await api('reload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
    status(t('status.reloadingAll'))
    void refreshState()
  })
  document.getElementById('btn-close').addEventListener('click', async () => {
    status(t('status.closing'))
    await api('close', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }).catch(() => {})
    window.close()
  })
  document.getElementById('btn-cookies').addEventListener('click', async () => {
    status(t('status.importingCookies'))
    const response = await api('cookies', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
    const payload = await response.json()
    if (payload.ok === true) {
      status(t('status.importedCookies', { n: payload.value.applied, sites: payload.value.sites ?? '' }), 'ok')
    } else if (payload.error === 'cookies-locked') {
      // Edge holds its cookie database open while it runs, so this is expected
      // whenever the user's own Edge is open — not a failure worth alarming over.
      status(t('status.cookiesLocked'), 'bad')
    } else if (payload.error === 'cookies-empty') {
      status(t('status.cookiesEmpty'), 'bad')
    } else {
      status(payload.error ?? t('status.cookieImportFailed'), 'bad')
    }
  })

  async function reloadPane(id) {
    await api('reload', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ panes: [id] }) }).catch(() => {})
  }

  // ---------- language ----------
  const languageSelect = document.getElementById('language-select')
  let languageTouched = false

  /** Apply the current language to the static page and the rendered UI. */
  function applyLanguage() {
    document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n)
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle)
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder)
    applyDynamicLanguage()
  }

  /** Re-render every list and label that JavaScript built. */
  function applyDynamicLanguage() {
    renderRail()
    renderHistory()
    renderSummaries()
    summariesToggle.title = timelineEl.dataset.collapsed === 'true' ? t('summary.expand') : t('summary.collapse')
    for (const pane of state.panes.values()) updateColumn(pane)
    for (const [id, refs] of columnRefs) {
      const expanded = state.expandedPane === id
      refs.reload.textContent = t('column.reload')
      refs.reload.title = t('column.reload.title', { model: refs.titleEl.textContent })
      refs.fullScreen.textContent = expanded ? t('column.restore') : t('column.full')
      refs.fullScreen.title = expanded ? t('column.restore.title') : t('column.full.title', { model: refs.titleEl.textContent })
      refs.loadingText.textContent = t('column.loading')
      refs.hint.textContent = t('column.click')
      refs.img.alt = t('column.liveView', { model: refs.titleEl.textContent })
    }
    if (state.find.open) showFindCount()
  }

  /**
   * Switch the interface language.
   * @param {string} next - 'en' or 'zh'.
   * @param {{ persist?: boolean }} [options] - false while loading the stored choice.
   */
  function setLanguage(next, options = {}) {
    const value = next === 'zh' ? 'zh' : 'en'
    const changed = value !== language
    language = value
    if (languageSelect !== null) languageSelect.value = language
    applyLanguage()
    if (changed && options.persist !== false) {
      void api('prefs', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ language }) }).catch(() => {})
    }
  }

  /** Read the stored language once; anything unexpected keeps English. */
  async function loadPreferences() {
    const response = await api('prefs').catch(() => null)
    const payload = response === null ? null : await response.json().catch(() => null)
    const stored = payload?.ok === true ? payload.value?.language : null
    if (languageTouched) return
    if (stored === 'en' || stored === 'zh') setLanguage(stored, { persist: false })
  }

  if (languageSelect !== null) {
    languageSelect.addEventListener('change', () => {
      languageTouched = true
      setLanguage(languageSelect.value)
    })
  }

  // ---------- boot ----------
  renderRail()
  renderGrid()
  applyLanguage()
  for (const pane of state.panes.values()) updateColumn(pane)
  // A reloaded shell must start in the five-column view: one tab could still be
  // at the wide full-screen viewport of the page that was just replaced.
  for (const pane of state.panes.values()) void sendViewport(pane, FRAME_W, FRAME_H)
  focusPane(state.activePane)
  void loadPreferences()
  void refreshState()
  void refreshHistory()
  void refreshSummaries()
  setInterval(() => { void refreshState() }, 4000)
  // The history changes when a prompt is sent or a column finishes answering,
  // so it polls a little slower than the pane status.
  setInterval(() => { void refreshHistory() }, 8000)
  // Summaries only change when the user presses Summarize or deletes one.
  setInterval(() => { void refreshSummaries() }, 10000)
  startFrames()
})()
</script>
</body>
</html>
